<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Byte | Article</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>

  <div id="bg-layer"></div>

  <header class="navbar">
    <a href="index.html" class="logo">✍️ The Daily Byte</a>
    <nav>
      <a href="index.html" class="nav-link">← Back</a>
      <a href="new.html" class="nav-link">+ New Post</a>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    </nav>
  </header>

  <main class="post-wrap">
    <article class="post-box" id="post-box"></article>
  </main>

  <script src="script.js"></script>
</body>
</html>
