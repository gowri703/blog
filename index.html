<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Daily Byte | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">✍️ The Daily Byte</a>
    <nav>
      <a href="index.html" class="nav-link">Home</a>
      <a href="new.html" class="nav-link">+ New Post</a>
      <button id="theme-btn" class="theme-btn" aria-label="Toggle dark mode">🌙 Dark Mode</button>
    </nav>
  </header>

  <section class="hero">
    <h1>Hi,<br>Welcome to The Daily Byte.</h1>
    <p>Short, simple reads on tech and student life.<br>Pick a story, or write your own.</p>
    <a href="new.html" class="pill-btn">Write a new post</a>
  </section>

  <main class="container">
    <h2 class="section-title">Latest Posts</h2>
    <div class="grid" id="post-grid"></div>
  </main>

  <footer class="footer">
    <p>© 2026 The Daily Byte • Built with HTML, CSS &amp; JavaScript</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
